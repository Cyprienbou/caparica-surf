name: Collect forecasts

# GitHub cron runs in UTC. Lisbon is UTC+0 in winter and UTC+1 in summer, so each
# slot is scheduled at two UTC hours. That guarantees fresh data before the
# 07:00, 12:00 and 18:00 Lisbon analyses all year (GitHub can delay runs by 10-30 min).
on:
  schedule:
    - cron: "20 4,5,10,11,16,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run offline tests
        run: python3 -m unittest discover -s tests

      - name: Fetch Open-Meteo forecasts
        run: python3 collector/collect.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "caparica-surf-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "data: forecast snapshot $(date -u +%Y-%m-%dT%H%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
